[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epochcontrol"
version = "0.0.1"
description = "See and control your training runs from the Mac menu bar. Early development."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Harrish Joseph" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
]

[tool.hatch.build.targets.wheel]
packages = ["epochcontrol"]
