[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epochcontrol"
version = "0.1.0.dev0"
description = "See and control your training runs from the Mac menu bar."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Harrish Joseph" }]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
]

[project.scripts]
epochcontrol = "epochcontrol._cli:main"

[project.optional-dependencies]
psutil = ["psutil"]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.18", "rfc3339-validator"]

[tool.hatch.build.targets.wheel]
packages = ["epochcontrol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 60  # a hung test prints its stack instead of hanging silently
